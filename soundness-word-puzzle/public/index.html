<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soundness Word Puzzle</title>
  <link href="/styles.css" rel="stylesheet" />
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #crossword-grid {
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      gap: 1px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      border: 2px solid #374151;
      background: #374151;
    }

    .grid-cell {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1f2937;
      font-weight: bold;
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    @media (min-width: 640px) {
      .grid-cell { font-size: 1rem; }
    }

    .cell-highlight {
      background: #60a5fa !important;
      color: white;
    }

    .cell-solved {
      background: #34d399 !important;
      color: white;
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .hidden { display: none; }

    .animate-pulse { animation: pulse 1s infinite; }

    button {
      transition: all 0.2s;
      font-weight: bold;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-size: 1.25rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2563eb;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #059669;
    }

    .btn-white {
      background: white;
      color: #1d4ed8;
    }

    .btn-white:hover:not(:disabled) {
      background: #f3f4f6;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-4xl font-bold mb-2">Word Search Challenge</h1>
    <div class="flex justify-center items-center gap-6 text-lg">
      <div id="timer-display" class="font-mono text-2xl">03:30</div>
    </div>
  </div>

  <!-- Score -->
  <div class="flex gap-8 mb-4 text-lg">
    <div>Score: <span id="score-display" class="font-bold text-yellow-400">0</span></div>
    <div>Words Found: <span id="words-solved-display" class="font-bold">0 / 31</span></div>
  </div>

  <!-- Grid -->
  <div id="crossword-grid"></div>

  <!-- Play Again Button -->
  <button id="play-again-btn" class="mt-6 btn-success hidden">
    Play Again
  </button>

  <!-- Start Modal -->
  <div id="start-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
    <div class="bg-blue-700 rounded-xl p-8 max-w-md w-full text-center shadow-2xl">
      <h2 class="text-3xl font-bold mb-4">WELCOME TO SOUNDNESS WORD SEARCH BY ANGELMYKL</h2>
      <p class="text-lg mb-6">
        You have <strong>3 minutes 30 seconds</strong> to find all <strong>31 hidden words</strong> by dragging or swiping your finger across the letters.
      </p>
      <button id="start-challenge-btn" class="btn-white">
        Start Challenge
      </button>
    </div>
  </div>

  <!-- Score Modal -->
  <div id="score-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-800 rounded-xl p-6 max-w-md w-full text-center">
      <h2 id="modal-heading" class="text-3xl font-bold mb-4"></h2>
      <p id="modal-message" class="text-lg mb-4"></p>
      <div class="text-xl mb-2">Score: <span id="modal-score" class="font-bold text-yellow-400">0</span></div>
      <div class="text-lg mb-6">Words Found: <span id="modal-solved-words" class="font-bold">0</span> / <span id="modal-total-words">31</span></div>
      
      <div id="share-container" class="mt-4"></div>

      <button onclick="resetGame()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">
        Play Again
      </button>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
